# Local development services:
#   docker compose up -d                       Postgres + Mailpit for `npm run dev`
#   docker compose --profile app up --build    the whole stack, production build
name: next-enterprise-starter

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outgoing email. SMTP on :1025, web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    profiles: [app]
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [app]
    build:
      context: .
      args:
        APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      APP_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  db-data:
